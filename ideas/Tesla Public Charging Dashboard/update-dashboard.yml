name: Update Dashboard
on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - run: pip install -r tesla-charging-dashboard/requirements.txt
      - run: python tesla-charging-dashboard/fetch_data.py
      - run: python tesla-charging-dashboard/process_dashboard.py
      - run: |
          git config user.name 'Actions'
          git config user.email 'actions@github.com'
          git add tesla-charging-dashboard/*
          git commit -m "Monthly charging update" || echo "No changes"
          git push
    env:
      TESLA_REFRESH_TOKEN: ${{ secrets.TESLA_REFRESH_TOKEN }}
      HOME_LAT: ${{ secrets.HOME_LAT }}
      HOME_LON: ${{ secrets.HOME_LON }}
